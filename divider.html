<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlElement">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">عداد القسمة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .top-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .back-button {
            padding: 10px 18px;
            border: 2px solid white;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .language-selector {
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            padding: 10px 18px;
            border: 2px solid white;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .lang-btn.active {
            background: white;
            color: #f5576c;
        }

        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* Stepper Styles */
        .stepper {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
            gap: 10px;
        }

        .step {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .step-number {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            font-weight: 700;
            border: 2px solid white;
            transition: all 0.3s ease;
        }

        .step.active .step-number {
            background: white;
            color: #f5576c;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transform: scale(1.1);
        }

        .step.completed .step-number {
            background: #10b981;
            color: white;
            border-color: #10b981;
        }

        .step-title {
            color: white;
            font-size: 0.9em;
            font-weight: 600;
            text-align: center;
            opacity: 0.8;
        }

        .step.active .step-title {
            opacity: 1;
            font-weight: 700;
        }

        .step.completed .step-title {
            color: #10b981;
        }

        .step-line {
            flex: 1;
            height: 2px;
            background: rgba(255, 255, 255, 0.3);
            align-self: flex-start;
            margin-top: 24px;
            margin-left: 10px;
            margin-right: 10px;
        }

        .step.completed .step-line {
            background: #10b981;
        }

        /* Content Styles */
        .content-area {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            min-height: 400px;
        }

        .step-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .step-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header-title {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header-subtitle {
            color: #666;
            font-size: 0.95em;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .input-group label {
            font-weight: 600;
            color: #333;
            font-size: 0.95em;
        }

        .input-group input {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #f5576c;
            box-shadow: 0 0 0 3px rgba(245, 87, 108, 0.1);
            background: #fafafa;
        }

        .names-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .name-input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .name-input-group label {
            font-weight: 600;
            color: #666;
            font-size: 0.9em;
        }

        .name-input-group input {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 0.95em;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .name-input-group input:focus {
            outline: none;
            border-color: #f5576c;
            box-shadow: 0 0 0 2px rgba(245, 87, 108, 0.1);
        }

        /* Results Styles */
        .results-header {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-box {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.2);
        }

        .info-label {
            font-size: 0.85em;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .info-value {
            font-size: 1.8em;
            font-weight: 700;
        }

        .allocation-table {
            width: 100%;
            margin-top: 20px;
        }

        .table-header {
            display: grid;
            grid-template-columns: 1fr 1fr 1.5fr;
            gap: 15px;
            margin-bottom: 15px;
            font-weight: 700;
            color: #333;
            font-size: 0.95em;
            border-bottom: 2px solid #f5576c;
            padding-bottom: 12px;
        }

        .table-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1.5fr;
            gap: 15px;
            padding: 15px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #f5576c;
            transition: all 0.3s ease;
            align-items: center;
        }

        .table-row:hover {
            background: #f0f5ff;
            border-left-color: #f093fb;
            transform: translateX(-5px);
        }

        .table-row-label {
            font-weight: 600;
            color: #333;
        }

        .table-row-value {
            font-size: 1.1em;
            font-weight: 700;
            color: #f5576c;
            text-align: center;
            padding: 10px;
            background: white;
            border-radius: 6px;
            border: 2px solid #f5576c;
        }

        /* Button Styles */
        .button-group {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 40px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.5);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .btn-success:hover {
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
            transform: translateY(-2px);
        }

        @media (max-width: 1024px) {
            .content-area {
                padding: 30px;
            }

            .results-header {
                grid-template-columns: 1fr;
            }

            .table-header,
            .table-row {
                grid-template-columns: 1fr 1fr 1.5fr;
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 10px;
            }

            .stepper {
                gap: 5px;
                margin-bottom: 30px;
            }

            .step-title {
                font-size: 0.75em;
            }

            .step-number {
                width: 40px;
                height: 40px;
                font-size: 1em;
            }

            .step-line {
                display: none;
            }

            .content-area {
                padding: 20px;
                min-height: auto;
            }

            .header-title {
                font-size: 1.3em;
            }

            .info-value {
                font-size: 1.4em;
            }

            .table-header,
            .table-row {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .names-grid {
                grid-template-columns: 1fr;
            }

            .button-group {
                gap: 10px;
            }

            .btn {
                flex: 1;
                padding: 12px 15px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-controls">
            <a href="index.html" class="back-button" id="backBtn">← الرجوع للصفحة الرئيسية</a>
            <div class="language-selector">
                <button class="lang-btn active" data-lang="ar" onclick="changeLanguage('ar')">العربية</button>
                <button class="lang-btn" data-lang="en" onclick="changeLanguage('en')">English</button>
                <button class="lang-btn" data-lang="fi" onclick="changeLanguage('fi')">Suomi</button>
            </div>
        </div>

        <!-- Stepper -->
        <div class="stepper" id="stepper"></div>

        <!-- Content Area -->
        <div class="content-area">
            <!-- Step 1: Quantity and People -->
            <div class="step-content active" id="step1Content">
                <div class="header-title" id="step1Title">الخطوة 1: الكمية والأشخاص</div>
                <div class="header-subtitle" id="step1Subtitle">أدخل الكمية الكلية وعدد الأشخاص</div>
                
                <div class="input-group">
                    <label id="labelQuantity">الكمية الكلية:</label>
                    <input type="number" id="totalQuantity" placeholder="مثال: 100" min="1" value="100">
                </div>

                <div class="input-group">
                    <label id="labelPeople">عدد الأشخاص:</label>
                    <input type="number" id="numberOfPeople" placeholder="مثال: 5" min="1" value="5">
                </div>

                <div class="button-group">
                    <button class="btn btn-primary" onclick="goToStep(2)" id="step1Btn">التالي →</button>
                </div>
            </div>

            <!-- Step 2: Names -->
            <div class="step-content" id="step2Content">
                <div class="header-title" id="step2Title">الخطوة 2: أسماء الأشخاص</div>
                <div class="header-subtitle" id="step2Subtitle">أدخل أسماء الأشخاص (اختياري)</div>
                
                <div class="names-grid" id="namesGrid"></div>

                <div class="button-group">
                    <button class="btn btn-secondary" onclick="goToStep(1)" id="step2BackBtn">← السابق</button>
                    <button class="btn btn-primary" onclick="goToStep(3)" id="step2Btn">التالي →</button>
                </div>
            </div>

            <!-- Step 3: Results -->
            <div class="step-content" id="step3Content">
                <div class="header-title" id="step3Title">الخطوة 3: نتائج التقسيم</div>
                <div class="header-subtitle" id="step3Subtitle">إليك توزيع الكمية</div>
                
                <div class="results-header">
                    <div class="info-box">
                        <div class="info-label" id="labelTotalLabel">الكمية الكلية</div>
                        <div class="info-value" id="totalDisplay">-</div>
                    </div>
                    <div class="info-box">
                        <div class="info-label" id="labelPeopleLabel">عدد الأشخاص</div>
                        <div class="info-value" id="peopleDisplay">-</div>
                    </div>
                    <div class="info-box">
                        <div class="info-label" id="labelAverageLabel">المتوسط للشخص</div>
                        <div class="info-value" id="averageDisplay">-</div>
                    </div>
                </div>

                <div class="allocation-table">
                    <div class="table-header">
                        <div id="labelPersonHeader">الشخص</div>
                        <div id="labelAmountHeader">الكمية</div>
                        <div style="text-align: center;" id="labelRangeHeader">الأجزاء المخصصة</div>
                    </div>
                    <div id="allocationList"></div>
                </div>

                <div class="button-group">
                    <button class="btn btn-secondary" onclick="goToStep(2)" id="step3BackBtn">← السابق</button>
                    <button class="btn btn-success" onclick="printPDF()" id="printPdfBtn">🖨️ طباعة PDF</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        let currentStep = 1;
        let currentLanguage = 'ar';
        let allocations = [];

        const translations = {
            ar: {
                mainTitle: '📊 عداد القسمة',
                mainSubtitle: 'قسم الكميات بين الأشخاص',
                backBtn: '← الرجوع للصفحة الرئيسية',
                step1Title: 'الخطوة 1: الكمية والأشخاص',
                step1Subtitle: 'أدخل الكمية الكلية وعدد الأشخاص',
                step2Title: 'الخطوة 2: أسماء الأشخاص',
                step2Subtitle: 'أدخل أسماء الأشخاص (اختياري)',
                step3Title: 'الخطوة 3: نتائج التقسيم',
                step3Subtitle: 'إليك توزيع الكمية',
                labelQuantity: 'الكمية الكلية:',
                labelPeople: 'عدد الأشخاص:',
                labelPerson: 'الشخص',
                person: 'الشخص',
                labelPersonHeader: 'الشخص',
                labelAmountHeader: 'الكمية',
                labelRangeHeader: 'الأجزاء المخصصة',
                labelTotalLabel: 'الكمية الكلية',
                labelPeopleLabel: 'عدد الأشخاص',
                labelAverageLabel: 'المتوسط للشخص',
            },
            en: {
                mainTitle: '📊 Quantity Divider',
                mainSubtitle: 'Distribute quantities among people',
                backBtn: '← Back to Home',
                step1Title: 'Step 1: Quantity and People',
                step1Subtitle: 'Enter total quantity and number of people',
                step2Title: 'Step 2: Names',
                step2Subtitle: 'Enter names for people (optional)',
                step3Title: 'Step 3: Results',
                step3Subtitle: 'Here is the distribution',
                labelQuantity: 'Total Quantity:',
                labelPeople: 'Number of People:',
                labelPerson: 'Person',
                person: 'Person',
                labelPersonHeader: 'Person',
                labelAmountHeader: 'Quantity',
                labelRangeHeader: 'Assigned Ranges',
                labelTotalLabel: 'Total Quantity',
                labelPeopleLabel: 'Number of People',
                labelAverageLabel: 'Average per Person',
            },
            fi: {
                mainTitle: '📊 Määrän Jakaja',
                mainSubtitle: 'Jaa määrät ihmisten kesken',
                backBtn: '← Takaisin kotisivulle',
                step1Title: 'Vaihe 1: Määrä ja ihmiset',
                step1Subtitle: 'Syötä kokonaismäärä ja ihmisten määrä',
                step2Title: 'Vaihe 2: Nimet',
                step2Subtitle: 'Syötä nimet ihmisille (valinnainen)',
                step3Title: 'Vaihe 3: Tulokset',
                step3Subtitle: 'Tässä on jakelu',
                labelQuantity: 'Kokonaismäärä:',
                labelPeople: 'Ihmisten määrä:',
                labelPerson: 'Henkilö',
                person: 'Henkilö',
                labelPersonHeader: 'Henkilö',
                labelAmountHeader: 'Määrä',
                labelRangeHeader: 'Määrätyt alueet',
                labelTotalLabel: 'Kokonaismäärä',
                labelPeopleLabel: 'Ihmisten määrä',
                labelAverageLabel: 'Keskiarvo',
            }
        };

        function changeLanguage(lang) {
            currentLanguage = lang;
            localStorage.setItem('dividerLanguage', lang);
            
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[data-lang="${lang}"]`).classList.add('active');
            
            const htmlElement = document.getElementById('htmlElement');
            const dir = lang === 'ar' ? 'rtl' : 'ltr';
            htmlElement.setAttribute('dir', dir);
            htmlElement.setAttribute('lang', lang);
            document.body.style.direction = dir;
            
            updateAllTexts();
        }

        function updateAllTexts() {
            const t = translations[currentLanguage];
            document.getElementById('backBtn').textContent = t.backBtn;
            document.getElementById('step1Title').textContent = t.step1Title;
            document.getElementById('step1Subtitle').textContent = t.step1Subtitle;
            document.getElementById('step2Title').textContent = t.step2Title;
            document.getElementById('step2Subtitle').textContent = t.step2Subtitle;
            document.getElementById('step3Title').textContent = t.step3Title;
            document.getElementById('step3Subtitle').textContent = t.step3Subtitle;
            document.getElementById('labelQuantity').textContent = t.labelQuantity;
            document.getElementById('labelPeople').textContent = t.labelPeople;
            document.getElementById('labelPersonHeader').textContent = t.labelPersonHeader;
            document.getElementById('labelAmountHeader').textContent = t.labelAmountHeader;
            document.getElementById('labelRangeHeader').textContent = t.labelRangeHeader;
            document.getElementById('labelTotalLabel').textContent = t.labelTotalLabel;
            document.getElementById('labelPeopleLabel').textContent = t.labelPeopleLabel;
            document.getElementById('labelAverageLabel').textContent = t.labelAverageLabel;
            updateStepperLabels();
            generateNameInputs(parseInt(document.getElementById('numberOfPeople').value) || 1);
        }

        function updateStepperLabels() {
            const t = translations[currentLanguage];
            const stepLabels = [t.step1Title, t.step2Title, t.step3Title];
            const steps = document.querySelectorAll('.step-title');
            steps.forEach((step, i) => {
                step.textContent = stepLabels[i];
            });
        }

        function createStepper() {
            const stepper = document.getElementById('stepper');
            stepper.innerHTML = '';
            const t = translations[currentLanguage];
            const stepLabels = [t.step1Title, t.step2Title, t.step3Title];
            
            for (let i = 1; i <= 3; i++) {
                const step = document.createElement('div');
                step.className = `step ${i === currentStep ? 'active' : ''} ${i < currentStep ? 'completed' : ''}`;
                step.innerHTML = `
                    <div class="step-number">${i}</div>
                    <div class="step-title">${stepLabels[i - 1]}</div>
                `;
                stepper.appendChild(step);
                
                if (i < 3) {
                    const line = document.createElement('div');
                    line.className = `step-line ${i < currentStep ? 'completed' : ''}`;
                    stepper.appendChild(line);
                }
            }
        }

        function goToStep(stepNum) {
            if (stepNum === 2 && !validateStep1()) return;
            if (stepNum === 3 && !validateStep2()) return;
            
            if (stepNum === 3) {
                calculateDivision();
            }
            
            currentStep = stepNum;
            document.querySelectorAll('.step-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`step${stepNum}Content`).classList.add('active');
            
            createStepper();
            window.scrollTo(0, 0);
        }

        function validateStep1() {
            const quantity = parseFloat(document.getElementById('totalQuantity').value);
            const people = parseInt(document.getElementById('numberOfPeople').value);
            
            if (!quantity || quantity <= 0) {
                alert(currentLanguage === 'ar' ? 'الرجاء إدخال كمية صحيحة' : 'Please enter valid quantity');
                return false;
            }
            if (!people || people <= 0) {
                alert(currentLanguage === 'ar' ? 'الرجاء إدخال عدد أشخاص صحيح' : 'Please enter valid number of people');
                return false;
            }
            return true;
        }

        function validateStep2() {
            return true;
        }

        function generateNameInputs(count) {
            const namesGrid = document.getElementById('namesGrid');
            const t = translations[currentLanguage];
            namesGrid.innerHTML = '';
            
            for (let i = 1; i <= count; i++) {
                const nameGroup = document.createElement('div');
                nameGroup.className = 'name-input-group';
                nameGroup.innerHTML = `<label>${t.person} ${i}</label><input type="text" id="personName_${i}" placeholder="${t.person} ${i}">`;
                namesGrid.appendChild(nameGroup);
            }
        }

        function calculateDivision() {
            const total = parseFloat(document.getElementById('totalQuantity').value);
            const people = parseInt(document.getElementById('numberOfPeople').value);
            allocations = [];
            
            const ranges = [];
            let currentNum = 1;
            const itemsPerPerson = Math.floor(total / people);
            const remainder = total % people;
            
            for (let i = 0; i < people; i++) {
                const rangeSize = itemsPerPerson + (i < remainder ? 1 : 0);
                const rangeEnd = currentNum + rangeSize - 1;
                ranges.push({start: currentNum, end: rangeEnd, size: rangeSize});
                currentNum = rangeEnd + 1;
            }
            
            for (let k = ranges.length - 1; k > 0; k--) {
                const j = Math.floor(Math.random() * (k + 1));
                const temp = ranges[k];
                ranges[k] = ranges[j];
                ranges[j] = temp;
            }
            
            for (let i = 1; i <= people; i++) {
                const nameInput = document.getElementById(`personName_${i}`);
                const personName = nameInput.value.trim() || (translations[currentLanguage].person + ' ' + i);
                const range = ranges[i - 1];
                const personItems = [];
                for (let num = range.start; num <= range.end; num++) {
                    personItems.push(num);
                }
                allocations.push({person: personName, amount: range.size, items: personItems});
            }
            
            displayResults(total, people);
        }

        function displayResults(total, people) {
            document.getElementById('totalDisplay').textContent = total.toFixed(2);
            document.getElementById('peopleDisplay').textContent = people;
            document.getElementById('averageDisplay').textContent = (total / people).toFixed(2);
            
            const allocationList = document.getElementById('allocationList');
            allocationList.innerHTML = '';
            
            allocations.forEach(allocation => {
                const row = document.createElement('div');
                row.className = 'table-row';
                row.innerHTML = `
                    <div class="table-row-label table-row-person">${allocation.person}</div>
                    <div class="table-row-value table-row-amount">${allocation.amount}</div>
                    <div class="table-row-value table-row-range">${allocation.items.join(', ')}</div>
                `;
                allocationList.appendChild(row);
            });
        }

        function printPDF() {
            const t = translations[currentLanguage];
            const jsPDF = window.jspdf.jsPDF;
            const total = parseFloat(document.getElementById('totalQuantity').value);
            const people = parseInt(document.getElementById('numberOfPeople').value);
            
            const printContainer = document.createElement('div');
            printContainer.style.position = 'absolute';
            printContainer.style.left = '-9999px';
            printContainer.style.width = '900px';
            printContainer.style.backgroundColor = 'white';
            printContainer.style.padding = '20px';
            printContainer.style.direction = currentLanguage === 'ar' ? 'rtl' : 'ltr';
            printContainer.style.fontFamily = 'Arial, sans-serif';
            
            const title = currentLanguage === 'ar' ? 'عداد القسمة' : 
                         currentLanguage === 'en' ? 'Quantity Divider' : 'Määrän Jakaja';
            
            let html = '';
            html += '<div style="text-align: center; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px;">';
            html += '<h1 style="margin: 0; font-size: 28px;">' + title + '</h1>';
            html += '</div>';
            
            html += '<div style="display: flex; gap: 15px; margin-bottom: 20px;">';
            
            const boxStyle = 'flex: 1; padding: 15px; border: 2px solid #f5576c; border-radius: 8px; text-align: center; background: #f9fafb;';
            const boxTitleStyle = 'font-weight: bold; color: #999; margin-bottom: 10px;';
            const boxValueStyle = 'font-size: 20px; font-weight: bold; color: #f5576c;';
            
            const totalLabel = currentLanguage === 'ar' ? 'الكمية الكلية' : 
                              currentLanguage === 'en' ? 'Total Quantity' : 'Kokonaismäärä';
            html += '<div style="' + boxStyle + '">';
            html += '<div style="' + boxTitleStyle + '">' + totalLabel + '</div>';
            html += '<div style="' + boxValueStyle + '">' + total.toFixed(2) + '</div>';
            html += '</div>';
            
            const peopleLabel = currentLanguage === 'ar' ? 'عدد الأشخاص' : 
                               currentLanguage === 'en' ? 'Number of People' : 'Ihmisten Määrä';
            html += '<div style="' + boxStyle + '">';
            html += '<div style="' + boxTitleStyle + '">' + peopleLabel + '</div>';
            html += '<div style="' + boxValueStyle + '">' + people + '</div>';
            html += '</div>';
            
            const avgLabel = currentLanguage === 'ar' ? 'المتوسط للشخص' : 
                            currentLanguage === 'en' ? 'Average per Person' : 'Keskiarvo';
            html += '<div style="' + boxStyle + '">';
            html += '<div style="' + boxTitleStyle + '">' + avgLabel + '</div>';
            html += '<div style="' + boxValueStyle + '">' + (total / people).toFixed(2) + '</div>';
            html += '</div>';
            
            html += '</div>';
            
            html += '<table style="width: 100%; border-collapse: collapse; margin-top: 20px;">';
            html += '<thead>';
            html += '<tr style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white;\">';
            html += '<th style="padding: 12px; text-align: center; border: 1px solid #ddd;">' + t.labelPersonHeader + '</th>';
            html += '<th style="padding: 12px; text-align: center; border: 1px solid #ddd;">' + t.labelAmountHeader + '</th>';
            html += '<th style="padding: 12px; text-align: center; border: 1px solid #ddd;">' + t.labelRangeHeader + '</th>';
            html += '</tr>';
            html += '</thead>';
            html += '<tbody>';
            
            let rowNum = 0;
            allocations.forEach(allocation => {
                const bgColor = rowNum % 2 === 0 ? '#f9fafb' : 'white';
                html += '<tr style="background-color: ' + bgColor + ';">';
                html += '<td style="padding: 10px; text-align: center; border: 1px solid #e0e0e0;">' + allocation.person + '</td>';
                html += '<td style="padding: 10px; text-align: center; border: 1px solid #e0e0e0;">' + allocation.amount + '</td>';
                html += '<td style="padding: 10px; text-align: center; border: 1px solid #e0e0e0; font-size: 12px;">' + allocation.items.join(', ') + '</td>';
                html += '</tr>';
                rowNum++;
            });
            
            html += '</tbody>';
            html += '</table>';
            
            const date = new Date().toLocaleDateString(currentLanguage === 'ar' ? 'ar-SA' : currentLanguage === 'fi' ? 'fi-FI' : 'en-US');
            html += '<div style="text-align: center; margin-top: 20px; color: #999; font-size: 12px;">' + date + '</div>';
            
            printContainer.innerHTML = html;
            document.body.appendChild(printContainer);
            
            html2canvas(printContainer, {
                scale: 2,
                backgroundColor: '#ffffff',
                useCORS: true,
                allowTaint: true
            }).then(function(canvas) {
                const imgData = canvas.toDataURL('image/png');
                const imgWidth = 210;
                const pageHeight = 297;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;
                
                const doc = new jsPDF({
                    orientation: imgHeight > imgWidth ? 'p' : 'l',
                    unit: 'mm',
                    format: 'a4'
                });
                
                let heightLeft = imgHeight;
                let position = 0;
                
                doc.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                heightLeft -= pageHeight;
                
                while (heightLeft >= 0) {
                    position = heightLeft - imgHeight;
                    doc.addPage();
                    doc.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                    heightLeft -= pageHeight;
                }
                
                const fileName = currentLanguage === 'ar' ? 'عداد_القسمة' : 
                                currentLanguage === 'en' ? 'Quantity_Divider' : 'Maaran_Jakaja';
                doc.save(fileName + '.pdf');
                
                document.body.removeChild(printContainer);
            });
        }

        window.addEventListener('DOMContentLoaded', function() {
            currentLanguage = localStorage.getItem('dividerLanguage') || 'ar';
            
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[data-lang="${currentLanguage}"]`).classList.add('active');
            
            const htmlElement = document.getElementById('htmlElement');
            const dir = currentLanguage === 'ar' ? 'rtl' : 'ltr';
            htmlElement.setAttribute('dir', dir);
            htmlElement.setAttribute('lang', currentLanguage);
            document.body.style.direction = dir;
            
            createStepper();
            updateAllTexts();
            
            document.getElementById('numberOfPeople').addEventListener('change', function() {
                generateNameInputs(parseInt(this.value) || 1);
            });
        });
    </script>
</body>
</html>
